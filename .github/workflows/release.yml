name: Release

# Runs only when a version tag is pushed (git tag v1.2.3 && git push origin v1.2.3).
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  GO_VERSION: "1.27.x"
  GORELEASER_VERSION: "v2.20.2"

jobs:
  release:
    runs-on: macos-latest # Xcode is present, so the Makefile skips the Command Line Tools overlay
    permissions:
      contents: write # create the GitHub Release and upload archives
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true
      - name: Test before releasing
        run: make test
      - name: Swift SDK paths for the Touch ID link
        run: ./scripts/swift-env.sh >> "$GITHUB_ENV"
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: ${{ env.GORELEASER_VERSION }}
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Keep checksums for the tap job
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: checksums
          path: dist/checksums.txt

  # DISABLED until ENABLE_HOMEBREW_TAP is set. The tap repo Arntek/homebrew-tap does not exist yet, and creating
  # it is Arnold's decision. To enable: create the repo, add a secret
  # HOMEBREW_TAP_TOKEN (fine-grained token, contents: write on that repo only),
  # then set the repository variable ENABLE_HOMEBREW_TAP to true. See docs/releasing.md.
  homebrew-tap:
    if: ${{ vars.ENABLE_HOMEBREW_TAP == 'true' }}
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Arntek/homebrew-tap
          path: tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: checksums
          path: checksums
      - name: Render formula and push to the tap
        env:
          TAG: ${{ github.ref_name }}
        run: |
          mkdir -p tap/Formula
          cp packaging/homebrew/secrets-vault.rb tap/Formula/secrets-vault.rb
          ./scripts/render-formula.sh tap/Formula/secrets-vault.rb "${TAG#v}" checksums/checksums.txt
          cd tap
          git config user.name "release-bot"
          git config user.email "release-bot@users.noreply.github.com"
          git add Formula/secrets-vault.rb
          git commit -m "secrets-vault ${TAG}"
          git push

  # DISABLED until ENABLE_NPM_PUBLISH is set. Publishing needs an npm account
  # and token, which is Arnold's to create. To enable: create an npm access
  # token that can publish "secrets-vault" (an automation / granular token),
  # store it as the secret NPM_TOKEN, then set the repository variable
  # ENABLE_NPM_PUBLISH to true. See docs/releasing.md.
  npm-publish:
    if: ${{ vars.ENABLE_NPM_PUBLISH == 'true' }}
    needs: release # the package downloads the GitHub Release, so it must exist first
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm provenance
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          registry-url: https://registry.npmjs.org
      - name: Set the package version to the tag and publish
        working-directory: packaging/npm
        env:
          TAG: ${{ github.ref_name }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          npm version "${TAG#v}" --no-git-tag-version
          cp ../../LICENSE LICENSE
          npm test
          npm publish --provenance --access public
